
<h3>Prompt Engineering Submission</h3>

<label for="prompt">Your Prompt</label>
<textarea
    id="prompt"
    name="prompt"
    placeholder="Enter your AI prompt here..."
    required>
</textarea>

<label for="output">AI Generated Output / Explanation</label>
<textarea
    id="output"
    name="output"
    placeholder="Paste your generated answer or explain your result..."
    required>
</textarea>

<label for="link">Final Project Link</label>
<input
    type="url"
    id="link"
    name="projectlink"
    placeholder="Paste your project link"
    required>
